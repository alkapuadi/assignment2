<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <!-- Career Fair: booths with banners and a briefcase -->
  <rect width="800" height="500" fill="#e7f5ff"/>
  <rect x="0" y="400" width="800" height="100" fill="#ced4da"/>
  <g>
    <rect x="60" y="180" width="200" height="220" fill="#1971c2"/><rect x="60" y="150" width="200" height="40" fill="#0b4d8c"/>
    <rect x="300" y="180" width="200" height="220" fill="#2f9e44"/><rect x="300" y="150" width="200" height="40" fill="#1b6d2d"/>
    <rect x="540" y="180" width="200" height="220" fill="#f08c00"/><rect x="540" y="150" width="200" height="40" fill="#a35f00"/>
  </g>
  <rect x="345" y="270" width="110" height="80" rx="10" fill="#5c3d2e"/>
  <rect x="380" y="250" width="40" height="25" rx="6" fill="none" stroke="#5c3d2e" stroke-width="8"/>
  <rect x="345" y="300" width="110" height="6" fill="#3d281e"/>
